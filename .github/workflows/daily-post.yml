name: Kinda CM Agent — Post Diario

on:
  schedule:
    # 22:00 UTC = 19:00 Chile invierno (UTC-3). En verano queda a las 18:00.
    - cron: '0 22 * * *'
  workflow_dispatch:  # permite disparar manualmente desde la UI de GitHub

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Cachear Chrome descargado por Puppeteer (~300 MB)
      - name: Cache Puppeteer Chrome
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-chrome-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: puppeteer-chrome-${{ runner.os }}-

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chrome para Puppeteer
        run: npx puppeteer browsers install chrome

      # Generar config.js en runtime desde GitHub Secrets (nunca en el repo)
      - name: Crear config.js desde secrets
        env:
          GOOGLE_API_KEY:         ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CSE_ID:          ${{ secrets.GOOGLE_CSE_ID }}
          SERPER_API_KEY:         ${{ secrets.SERPER_API_KEY }}
          PEXELS_API_KEY:         ${{ secrets.PEXELS_API_KEY }}
          GEMINI_API_KEY:         ${{ secrets.GEMINI_API_KEY }}
          META_ACCESS_TOKEN:      ${{ secrets.META_ACCESS_TOKEN }}
          META_IG_USER_ID:        ${{ secrets.META_IG_USER_ID }}
          FTP_HOST:               ${{ secrets.FTP_HOST }}
          FTP_USER:               ${{ secrets.FTP_USER }}
          FTP_PASS:               ${{ secrets.FTP_PASS }}
          AGENT_BASE_URL:         ${{ secrets.AGENT_BASE_URL }}
          TIKTOK_CLIENT_KEY:      ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET:   ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN:   ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          GMAIL_USER:             ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:     ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL_TO:        ${{ secrets.NOTIFY_EMAIL_TO }}
        run: |
          node -e "
          const cfg = {
            agentKey:            'github-actions',
            googleApiKey:        process.env.GOOGLE_API_KEY       || '',
            googleCseId:         process.env.GOOGLE_CSE_ID        || '',
            serperApiKey:        process.env.SERPER_API_KEY       || '',
            pexelsApiKey:        process.env.PEXELS_API_KEY       || '',
            geminiApiKey:        process.env.GEMINI_API_KEY       || '',
            metaAccessToken:     process.env.META_ACCESS_TOKEN    || '',
            metaIgUserId:        process.env.META_IG_USER_ID      || '',
            ftpHost:             process.env.FTP_HOST             || '',
            ftpUser:             process.env.FTP_USER             || '',
            ftpPass:             process.env.FTP_PASS             || '',
            ftpOutputPath:       '/output',
            agentBaseUrl:        process.env.AGENT_BASE_URL       || 'https://kindagrowth.cl/asistente',
            tiktokClientKey:     process.env.TIKTOK_CLIENT_KEY    || '',
            tiktokClientSecret:  process.env.TIKTOK_CLIENT_SECRET || '',
            tiktokRefreshToken:  process.env.TIKTOK_REFRESH_TOKEN || '',
            gmailUser:           process.env.GMAIL_USER           || '',
            gmailAppPassword:    process.env.GMAIL_APP_PASSWORD   || '',
            notifyEmailTo:       process.env.NOTIFY_EMAIL_TO      || 'kindamusic.mkt@gmail.com',
            screenshotApiKey:    '',
          };
          require('fs').writeFileSync('config.js', 'module.exports = ' + JSON.stringify(cfg, null, 2) + ';');
          console.log('config.js generado desde secrets');
          "

      - name: Correr agente
        run: node agent.js

      # Cubre SOLO fallos ANTERIORES a agent.js (npm ci, instalación de Chrome, etc).
      # Si config.js existe, agent.js llegó a correr y ya mandó su propia notificación
      # via notify.js — este step se salta para no duplicar el aviso.
      - name: Notificar fallo de infraestructura (fuera del agente)
        if: failure()
        env:
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL_TO:    ${{ secrets.NOTIFY_EMAIL_TO }}
          RUN_URL:            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -f config.js ]; then
            echo "config.js existe — agent.js ya corrió y notificó por su cuenta. Sin duplicar."
            exit 0
          fi
          if [ -n "$GMAIL_USER" ] && [ -n "$GMAIL_APP_PASSWORD" ]; then
            node -e "
            const nodemailer = require('nodemailer');
            const transport = nodemailer.createTransport({
              host: 'smtp.gmail.com', port: 465, secure: true,
              auth: { user: process.env.GMAIL_USER, pass: process.env.GMAIL_APP_PASSWORD },
            });
            transport.sendMail({
              from: '\"Kinda CM Agent\" <' + process.env.GMAIL_USER + '>',
              to: process.env.NOTIFY_EMAIL_TO || 'kindamusic.mkt@gmail.com',
              subject: '❌ Kinda CM Agent — Falló antes de correr el agente',
              html: '<p>El workflow falló en setup (npm ci, Puppeteer, etc).</p><p><a href=\"' + process.env.RUN_URL + '\">Ver el run en GitHub Actions</a></p>',
            }).then(() => console.log('Email de fallo enviado')).catch(e => console.warn('No se pudo enviar email:', e.message));
            " || true
          fi

      # Rotar refresh token de TikTok en GitHub Secrets (si el agente generó uno nuevo)
      # Requiere KINDA_GITHUB_PAT con scope "repo" para poder escribir secrets
      - name: Rotar refresh token de TikTok
        if: always()
        env:
          GH_TOKEN: ${{ secrets.KINDA_GITHUB_PAT }}
        run: |
          if [ -f data/tiktok_token.json ] && [ -n "$GH_TOKEN" ]; then
            NEW_TOKEN=$(node -e "process.stdout.write(require('./data/tiktok_token.json').refresh_token || '')")
            if [ -n "$NEW_TOKEN" ]; then
              echo "$NEW_TOKEN" | gh secret set TIKTOK_REFRESH_TOKEN --repo ${{ github.repository }}
              echo "✓ TIKTOK_REFRESH_TOKEN rotado en GitHub Secrets"
              rm data/tiktok_token.json
            fi
          fi

      # Guardar backlog actualizado en el repo para que persista entre runs.
      # if: always() — corre incluso si agent.js falló a mitad de camino (ej. Instagram
      # publicó pero TikTok o el commit anterior fallaron): el backlog ya pudo haber
      # marcado la idea como publicada y eso DEBE persistir para no republicarla mañana.
      - name: Commit backlog actualizado
        if: always()
        run: |
          git config user.name  "Kinda CM Agent"
          git config user.email "agent@kindaclub.com"

          git add data/backlog.json
          [ -f data/pexels_used.json ]  && git add data/pexels_used.json
          [ -f data/post_history.json ] && git add data/post_history.json

          if git diff --staged --quiet; then
            echo "Sin cambios en backlog — nada que commitear."
            exit 0
          fi

          git commit -m "chore: backlog + pexels post $(date -u +%Y-%m-%d)"

          # Reintentar push con rebase por si el remoto avanzó entre el checkout y ahora
          for i in 1 2 3 4 5; do
            if git push; then
              echo "✓ Push exitoso (intento $i)"
              exit 0
            fi
            echo "Push rechazado (intento $i/5) — haciendo pull --rebase y reintentando..."
            git pull --rebase origin main
            sleep 3
          done

          echo "❌ No se pudo pushear el backlog tras 5 intentos"
          exit 1
